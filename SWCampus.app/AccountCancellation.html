<html>
    <head>
        <title>注销账号</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <style>
            p {
                padding: 10pt;
                text-align: justify;
                line-height: 20pt;
            }

            .bigger {
                font-size: 108%;
            }

        </style>
    </head>
    <body>
        <p class="bigger">
            注销账号涉及服务的不可用，基于谨慎考虑，需要按如下流程进行操作：
        </p>
        <p>
            1、请提交书面申请至 service_ydsj@iydsj.cn 邮箱，申请内容包含手机账号、用户id、学校、学号、姓名等信息。<br>
            2、我们将通过电话或发送验证码方式确认是否您本人意愿，必要情况下还需要您在系统中提交账号密码核实（密码传输和比对会加密）。<br>
            3、确认您的学校、学号、姓名等学籍信息。<br>
            4、告知注销账号说明。<br>
            5、完成注销操作，账号停止使用。<br>
        </p>
        <p>
            在您提交注销申请后，我们将在7个工作日内 联系您。
        </p>
    </body>
</html>
